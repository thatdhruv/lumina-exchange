global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Docker DNS returns every replica for a scaled service; dns_sd_configs scrapes all of them.
  - job_name: lumina
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api, engine, projector]
        type: A
        port: 8081
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: role
