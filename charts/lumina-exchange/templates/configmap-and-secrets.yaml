apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumina.fullname" . }}-config
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.postgres.url | quote }}
  LUMINA_KAFKA_PARTITIONS: {{ .Values.kafka.partitions | quote }}
  LUMINA_KAFKA_REPLICATION_FACTOR: {{ .Values.kafka.replicationFactor | quote }}
  LUMINA_KAFKA_MIN_INSYNC_REPLICAS: {{ .Values.kafka.minInsyncReplicas | quote }}
  LUMINA_TRACING_SAMPLING: {{ .Values.tracing.samplingProbability | quote }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
{{- if not .Values.postgres.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lumina.fullname" . }}-postgres
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
{{- end }}
{{- if not .Values.security.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lumina.fullname" . }}-api-keys
  labels:
    {{- include "lumina.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $k := .Values.security.apiKeys }}
  LUMINA_SECURITY_APIKEYS_{{ $i }}_KEY: {{ $k.key | quote }}
  LUMINA_SECURITY_APIKEYS_{{ $i }}_ACCOUNT: {{ $k.account | quote }}
  {{- end }}
{{- end }}
