// Public gRPC API. Prices and quantities are decimal strings (never floats).
// Authenticate with the "x-api-key" metadata header.
syntax = "proto3";

package lumina.orderbook.v1;

option java_multiple_files = true;
option java_package = "com.lumina.orderbook.grpc";

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (OrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  rpc GetOrderBook(OrderBookRequest) returns (OrderBookResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0; // defaults to GTC
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

message PlaceOrderRequest {
  string symbol = 1;
  Side side = 2;
  OrderType type = 3;
  string price = 4;
  string quantity = 5;
  TimeInForce time_in_force = 6;
  bool post_only = 7;
  string idempotency_key = 8;
}

message CancelOrderRequest {
  string order_id = 1;
}

message OrderResponse {
  string id = 1;
  string symbol = 2;
  Side side = 3;
  OrderType type = 4;
  TimeInForce time_in_force = 5;
  string price = 6;
  string quantity = 7;           // original quantity
  string filled_quantity = 8;
  string remaining_quantity = 9;
  string status = 10;            // OPEN | PARTIAL | FILLED | CANCELLED | REJECTED
  string reject_reason = 11;
  string created_at = 12;
}

message OrderBookRequest {
  string symbol = 1;
  int32 depth = 2;
}

message OrderBookLevel {
  string price = 1;
  string quantity = 2;
}

message OrderBookResponse {
  string symbol = 1;
  int64 sequence = 2;
  repeated OrderBookLevel bids = 3;
  repeated OrderBookLevel asks = 4;
}
